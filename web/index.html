<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Our Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg-photo" style="background-image: url('bg-paper-chain.jpg?v=2');"></div>

<div id="login-screen" class="screen">
  <div class="login-card">
    <svg class="chain-banner" viewBox="0 0 200 60" aria-hidden="true">
      <circle class="ring r1" cx="22" cy="36" r="20" />
      <circle class="ring r2" cx="48" cy="24" r="20" />
      <circle class="ring r3" cx="74" cy="36" r="20" />
      <circle class="ring r4" cx="100" cy="24" r="20" />
      <circle class="ring r5" cx="126" cy="36" r="20" />
      <circle class="ring r6" cx="152" cy="24" r="20" />
    </svg>
    <h1>Our Countdown</h1>
    <p class="subtitle">Enter the password to unlock</p>
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" />
    <button id="login-button">Unlock</button>
    <p id="login-error" class="error-text hidden"></p>
  </div>
</div>

<div id="app-screen" class="screen hidden">
  <header>
    <div>
      <svg class="chain-banner chain-banner-small" viewBox="0 0 200 60" aria-hidden="true">
        <circle class="ring r1" cx="22" cy="36" r="20" />
        <circle class="ring r2" cx="48" cy="24" r="20" />
        <circle class="ring r3" cx="74" cy="36" r="20" />
        <circle class="ring r4" cx="100" cy="24" r="20" />
        <circle class="ring r5" cx="126" cy="36" r="20" />
        <circle class="ring r6" cx="152" cy="24" r="20" />
      </svg>
      <h1>Our Countdown</h1>
    </div>
    <div class="header-actions">
      <button id="theme-button" title="Customize colors" class="icon-button">&#127912;</button>
      <button id="logout-button" title="Sign out of this device">Sign out</button>
    </div>
  </header>

  <section id="primary-countdown" class="primary-card hidden">
    <div class="primary-label" id="primary-label"></div>
    <div class="primary-time" id="primary-time"></div>
  </section>

  <section id="empty-state" class="hidden">
    <p>No countdowns yet. Add the next one below.</p>
  </section>

  <section id="countdown-list"></section>

  <button id="add-button">+ Add a countdown</button>

  <a id="get-widget-link" class="get-widget-link"
     href="https://github.com/blakeaneyland-arch/neyland-family-countdown-releases/releases/download/v1.0/app-debug.apk"
     target="_blank">
    Get the home-screen widget for Android
  </a>
</div>

<div id="theme-modal" class="screen hidden">
  <div class="modal-card">
    <h2>Customize colors</h2>
    <p class="subtitle">Shared -- changes apply for both of you</p>

    <label for="accent-color-input">Link color</label>
    <input type="color" id="accent-color-input" value="#ff7a9e" />

    <label for="paper-color-input">Background color</label>
    <input type="color" id="paper-color-input" value="#1b1f2a" />

    <div class="modal-actions">
      <button id="theme-cancel-button" class="secondary">Close</button>
      <button id="theme-save-button">Save</button>
    </div>
  </div>
</div>

<div id="edit-modal" class="screen hidden">
  <div class="modal-card">
    <h2 id="modal-title">Add countdown</h2>
    <label for="label-input">What is it?</label>
    <input type="text" id="label-input" maxlength="80" placeholder="e.g. I'm home" />

    <label for="date-input">When?</label>
    <input type="datetime-local" id="date-input" />

    <div class="modal-actions">
      <button id="cancel-button" class="secondary">Cancel</button>
      <button id="delete-button" class="danger hidden">Delete</button>
      <button id="save-button">Save</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
