<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Our Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Fredoka:wght@500;600&family=Shadows+Into+Light&family=Permanent+Marker&family=Pacifico&family=Indie+Flower&family=Baloo+2:wght@600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg-photo" style="background-image: url('bg-paper-chain.jpg?v=3');"></div>

<div id="login-screen" class="screen">
  <div class="login-card">
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" />
    <button id="login-button">Unlock</button>
    <p id="login-error" class="error-text hidden"></p>
  </div>
</div>

<div id="app-screen" class="screen hidden">
  <section id="primary-countdown" class="primary-card hidden">
    <div class="primary-label" id="primary-label"></div>
    <div class="primary-time" id="primary-time"></div>
  </section>

  <section id="empty-state" class="hidden">
    <p>No countdowns yet. Add the next one below.</p>
  </section>

  <section id="countdown-list"></section>

  <button id="add-button" class="fab" title="Add a countdown">+</button>

  <button id="logout-button" class="invisible-hotspot" title="Sign out of this device"></button>
</div>

<div id="edit-modal" class="screen hidden">
  <div class="modal-card">
    <h2 id="modal-title">Add countdown</h2>
    <label for="label-input">What is it?</label>
    <input type="text" id="label-input" maxlength="80" placeholder="e.g. I'm home" />

    <label for="date-input">When?</label>
    <input type="datetime-local" id="date-input" />

    <label>Tile color</label>
    <div class="color-swatches" id="color-swatches"></div>

    <label>Text color</label>
    <div class="color-swatches" id="text-color-swatches"></div>

    <label>Font</label>
    <div class="font-options" id="font-options"></div>

    <label for="opacity-input">Tile transparency</label>
    <input type="range" id="opacity-input" min="10" max="100" step="5" />

    <label for="scale-input">Text size</label>
    <input type="range" id="scale-input" min="0.6" max="3" step="0.1" />

    <label for="primary-scale-input">Featured size (when shown at the top)</label>
    <input type="range" id="primary-scale-input" min="1" max="2.2" step="0.05" />

    <button type="button" id="primary-toggle-button" class="secondary">&#11088; Show at the top</button>

    <div class="modal-actions">
      <button id="cancel-button" class="secondary">Cancel</button>
      <button id="delete-button" class="danger hidden">Delete</button>
      <button id="save-button">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
